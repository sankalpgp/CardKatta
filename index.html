```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Scorekeeper</title>

<style>
* {
    box-sizing: border-box;

body {
    font-family: Arial, sans-serif;
    background: #fff;

}

}

header {

}

h1 {
    font-size: 28px;
}

button {

    background: #000;

    padding: 10px 18px;
    cursor: pointer;

}

button:hover {

.user-badge {

    border: 2px solid #000;

    display: flex;

input {
    width: 100%;

    background: #fff;

/* Fireworks */

#fireworks {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 9999;
}

.firework {
    position: absolute;
    width: 5px;
    height: 5px;
    background: #000;
    border-radius: 50%;
    animation: explode 1.5s ease-out forwards;
}

@keyframes explode {
    0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
    }

    100% {
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0.2);
        opacity: 0;
    }
}

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .score-table {
        font-size: 13px;
    }

    .score-input {
        width: 65px;
    }
}
</style>
</head>

<body>

<div id="fireworks"></div>

<div class="container">

<header>
    <h1>♠ Card Scorekeeper</h1>

    <div class="header-actions">
        <span id="userBadge" class="user-badge">User</span>

        <button id="logoutBtn" type="button">
            Logout
        </button>

        <button id="historyBtn">
            Game History
        </button>
    </div>
</header>


<!-- NEW GAME -->

<section id="gameSection">

<div class="card">

    <h2>Players</h2>

    <div id="playersContainer">

        <div class="player-input">
            <input
                type="text"
                class="player-name"
                placeholder="Player 1">

            <button
                class="remove-btn"
                type="button"
                onclick="removePlayer(this)">
                ✕
            </button>
        </div>

        <div class="player-input">
            <input
                type="text"
                class="player-name"
                placeholder="Player 2">

            <button
                class="remove-btn"
                type="button"
                onclick="removePlayer(this)">
                ✕
            </button>
        </div>

    </div>

    <button
        class="add-btn"
        onclick="addPlayer()">
        + Add Player
    </button>

    <button onclick="startGame()">
        Start Game
    </button>

</div>


<!-- SCORE -->

<div
    id="scoreSection"
    class="card hidden">

    <h2>Current Game</h2>

    <div id="roundInfo">
        Round 1
    </div>

    <table class="score-table">

        <thead>
            <tr id="tableHeader"></tr>
        </thead>

        <tbody>
            <tr id="scoreRow"></tr>
        </tbody>

    </table>

    <div class="actions">

        <button onclick="addRound()">
            + Add Round
        </button>

        <button onclick="finishGame()">
            Finish & Save Game
        </button>

        <button onclick="resetGame()">
            New Game
        </button>

    </div>


    <!-- LEADERBOARD -->

    <div class="leaderboard">

        <h2>
            Leaderboard
            <small>(Lowest score wins)</small>
        </h2>

        <div id="leaderboard"></div>

    </div>

    <div class="round-summary">
        <h3>Round Results</h3>
        <div id="roundSummary"></div>
    </div>

</div>

</section>


<!-- HISTORY -->

<section
    id="historySection"
    class="card hidden">

    <div class="history-header">

        <h2>Game History</h2>

        <button onclick="showGame()">
            Back
        </button>

    </div>

    <div id="historyContainer"></div>

</section>

</div>


<script>

if (sessionStorage.getItem("isLoggedIn") !== "true") {
    window.location.href = "login_index.html";
}

const userEmail = sessionStorage.getItem("userEmail") || "User";
const userBadge = document.getElementById("userBadge");
if (userBadge) {
    userBadge.textContent = userEmail;
}

const logoutBtn = document.getElementById("logoutBtn");
if (logoutBtn) {
    logoutBtn.addEventListener("click", () => {
        sessionStorage.removeItem("isLoggedIn");
        sessionStorage.removeItem("userEmail");
        window.location.href = "login_index.html";
    });
}

let players = [];
let rounds = [];
let currentRound = 0;

function renderRoundSummary() {
    const container = document.getElementById("roundSummary");

    if (!container) {
        return;
    }

    if (!players.length || rounds.length === 0) {
        container.innerHTML = '<div class="round-summary-empty">No round results yet.</div>';
        return;
    }

    const headers = ["Round"]
        .concat(players.map(player => player.name));

    const rows = rounds
        .map((roundScores, roundIndex) => {
            const cells = [
                `<td>Round ${roundIndex + 1}</td>`,
                ...roundScores.map((score, playerIndex) =>
                    `<td>${score}</td>`
                )
            ];

            return `<tr>${cells.join("")}</tr>`;
        })
        .join("");

    container.innerHTML = `
        <table class="round-summary-table">
            <thead>
                <tr>
                    ${headers.map(header => `<th>${header}</th>`).join("")}
                </tr>
            </thead>
            <tbody>
                ${rows}
            </tbody>
        </table>
    `;
}


// ===============================
// ADD PLAYER
// ===============================

function addPlayer() {

    const container =
        document.getElementById(
            "playersContainer"
        );

    const count =
        container.querySelectorAll(
            ".player-input"
        ).length + 1;

    const div =
        document.createElement("div");

    div.className = "player-input";

    div.innerHTML = `
        <input
            type="text"
            class="player-name"
            placeholder="Player ${count}">

        <button
            class="remove-btn"
            type="button"
            onclick="removePlayer(this)">
            ✕
        </button>
    `;

    container.appendChild(div);
}


// ===============================
// REMOVE PLAYER
// ===============================

function removePlayer(button) {

    const container =
        document.getElementById(
            "playersContainer"
        );

    if (container.children.length <= 2) {

        alert(
            "At least 2 players are required."
        );

        return;
    }

    button.parentElement.remove();
}


// ===============================
// START GAME
// ===============================

function startGame() {

    const inputs =
        document.querySelectorAll(
            ".player-name"
        );

    players = [];

    for (let i = 0; i < inputs.length; i++) {

        const name =
            inputs[i].value.trim();

        if (name === "") {

            alert(
                "Please enter a name for Player " +
                (i + 1)
            );

            return;
        }

        players.push({
            name: name,
            total: 0
        });
    }

    if (players.length < 2) {

        alert(
            "Add at least 2 players."
        );

        return;
    }

    rounds = [];
    currentRound = 0;

    document
        .getElementById("scoreSection")
        .classList.remove("hidden");

    createRound();

    updateLeaderboard();
    renderRoundSummary();

    document
        .getElementById("scoreSection")
        .scrollIntoView({
            behavior: "smooth"
        });
}


// ===============================
// CREATE ROUND
// ===============================

function createRound() {

    currentRound++;

    document.getElementById(
        "roundInfo"
    ).innerText =
        "Round " + currentRound;

    const header =
        document.getElementById(
            "tableHeader"
        );

    const row =
        document.getElementById(
            "scoreRow"
        );

    header.innerHTML = "";
    row.innerHTML = "";

    players.forEach(player => {

        const th =
            document.createElement("th");

        th.innerText = player.name;

        header.appendChild(th);


        const td =
            document.createElement("td");

        td.innerHTML = `
            <input
                type="number"
                class="score-input"
                data-player="${player.name}"
                value="0"
                min="0">
        `;

        row.appendChild(td);

    });
}


// ===============================
// ADD ROUND
// ===============================

function addRound() {

    const inputs =
        document.querySelectorAll(
            ".score-input"
        );

    const roundScores = [];

    inputs.forEach(input => {

        let score =
            parseInt(input.value);

        if (isNaN(score)) {
            score = 0;
        }

        if (score < 0) {
            score = 0;
        }

        roundScores.push(score);
    });


    rounds.push(roundScores);


    players.forEach(
        (player, index) => {

            player.total +=
                roundScores[index];

        }
    );


    updateLeaderboard();
    renderRoundSummary();

    createRound();
}


// ===============================
// LEADERBOARD
// LOWEST SCORE = WINNER
// ===============================

function updateLeaderboard() {

    const leaderboard =
        document.getElementById(
            "leaderboard"
        );

    leaderboard.innerHTML = "";


    // Sort LOWEST to HIGHEST

    const sorted =
        [...players].sort(
            (a, b) => a.total - b.total
        );


    sorted.forEach(
        (player, index) => {

            const div =
                document.createElement("div");

            div.className =
                "leader";


            // First player is winner

            if (index === 0) {

                div.classList.add(
                    "winner-row"
                );

                div.innerHTML = `

                    <span>

                        <span class="rank">
                            🏆 1st
                        </span>

                        <strong>
                            ${player.name}
                        </strong>

                        <span class="winner-badge">
                            WINNER
                        </span>

                    </span>

                    <strong>
                        ${player.total} points
                    </strong>
                `;

            } else {

                div.innerHTML = `

                    <span>

                        <span class="rank">
                            ${index + 1}.
                        </span>

                        ${player.name}

                    </span>

                    <strong>
                        ${player.total} points
                    </strong>
                `;
            }

            leaderboard.appendChild(div);
        }
    );
}


// ===============================
// FINISH GAME
// ===============================

function finishGame() {

    // Save the final round

    const inputs =
        document.querySelectorAll(
            ".score-input"
        );

    const roundScores = [];

    inputs.forEach(input => {

        let score =
            parseInt(input.value);

        if (isNaN(score)) {
            score = 0;
        }

        if (score < 0) {
            score = 0;
        }

        roundScores.push(score);
    });


    rounds.push(roundScores);


    players.forEach(
        (player, index) => {

            player.total +=
                roundScores[index];

        }
    );


    // Find winner

    const sorted =
        [...players].sort(
            (a, b) => a.total - b.total
        );

    const winner = sorted[0];


    // Save game

    const game = {

        id: Date.now(),

        date:
            new Date().toLocaleString(),

        winner:
            winner.name,

        winningScore:
            winner.total,

        players:
            players.map(
                player => ({
                    name: player.name,
                    total: player.total
                })
            ),

        rounds:
            rounds
    };


    let history =
        JSON.parse(
            localStorage.getItem(
                "cardGames"
            )
        ) || [];


    history.unshift(game);


    localStorage.setItem(
        "cardGames",
        JSON.stringify(history)
    );


    // Show final leaderboard

    updateLeaderboard();
    renderRoundSummary();


    // Fireworks

    launchFireworks();


    alert(
        "🎉 " +
        winner.name +
        " wins with " +
        winner.total +
        " points!"
    );
}


// ===============================
// FIREWORKS
// ===============================

function launchFireworks() {

    const container =
        document.getElementById(
            "fireworks"
        );

    container.innerHTML = "";


    for (let i = 0; i < 120; i++) {

        const particle =
            document.createElement(
                "div"
            );

        particle.className =
            "firework";


        const startX =
            Math.random() * 100;

        const startY =
            Math.random() * 50;


        const x =
            (Math.random() - 0.5) * 500;

        const y =
            (Math.random() - 0.5) * 500;


        particle.style.left =
            startX + "%";

        particle.style.top =
            startY + "%";

        particle.style.setProperty(
            "--x",
            x + "px"
        );

        particle.style.setProperty(
            "--y",
            y + "px"
        );


        particle.style.animationDelay =
            Math.random() * 0.5 + "s";


        container.appendChild(
            particle
        );
    }


    setTimeout(() => {

        container.innerHTML = "";

    }, 2500);
}


// ===============================
// RESET GAME
// ===============================

function resetGame() {

    players = [];
    rounds = [];
    currentRound = 0;

    document
        .getElementById(
            "scoreSection"
        )
        .classList.add("hidden");

    const roundSummary = document.getElementById("roundSummary");
    if (roundSummary) {
        roundSummary.innerHTML = '<div class="round-summary-empty">No round results yet.</div>';
    }

    document
        .getElementById(
            "playersContainer"
        )
        .innerHTML = `

        <div class="player-input">

            <input
                type="text"
                class="player-name"
                placeholder="Player 1">

            <button
                class="remove-btn"
                type="button"
                onclick="removePlayer(this)">
                ✕
            </button>

        </div>

        <div class="player-input">

            <input
                type="text"
                class="player-name"
                placeholder="Player 2">

            <button
                class="remove-btn"
                type="button"
                onclick="removePlayer(this)">
                ✕
            </button>

        </div>
    `;
}


// ===============================
// SHOW HISTORY
// ===============================

function showHistory() {

    document
        .getElementById(
            "gameSection"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "historySection"
        )
        .classList.remove("hidden");


    loadHistory();
}


function showGame() {

    document
        .getElementById(
            "historySection"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "gameSection"
        )
        .classList.remove("hidden");
}


// ===============================
// LOAD HISTORY
// ===============================

function loadHistory() {

    const container =
        document.getElementById(
            "historyContainer"
        );

    let history =
        JSON.parse(
            localStorage.getItem(
                "cardGames"
            )
        ) || [];


    if (history.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No games saved yet.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    history.forEach(
        (game, index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "history-item";


            // Lowest to highest

            const sortedPlayers =
                [...game.players].sort(
                    (a, b) =>
                        a.total - b.total
                );


            let playersHTML = "";


            sortedPlayers.forEach(
                (player, playerIndex) => {

                    playersHTML += `

                        <div class="leader">

                            <span>

                                ${
                                    playerIndex === 0
                                    ? "🏆 "
                                    : (playerIndex + 1) + ". "
                                }

                                ${player.name}

                                ${
                                    playerIndex === 0
                                    ? " — WINNER"
                                    : ""
                                }

                            </span>

                            <strong>
                                ${player.total} points
                            </strong>

                        </div>
                    `;
                }
            );


            const roundResultsHTML = game.rounds && game.rounds.length
                ? `
                    <div style="margin-top: 20px;">
                        <h4 style="margin-bottom: 8px;">Round Results</h4>
                        <table class="score-table" style="margin-top: 0;">
                            <thead>
                                <tr>
                                    <th>Round</th>
                                    ${game.players.map(player => `<th>${player.name}</th>`).join("")}
                                </tr>
                            </thead>
                            <tbody>
                                ${game.rounds.map((roundScores, roundIndex) => `
                                    <tr>
                                        <td>Round ${roundIndex + 1}</td>
                                        ${roundScores.map(score => `<td>${score}</td>`).join("")}
                                    </tr>
                                `).join("")}
                            </tbody>
                        </table>
                    </div>
                `
                : '<div style="margin-top: 20px; color: #666;">No rounds recorded.</div>';

            div.innerHTML = `

                <div class="history-header">

                    <strong>
                        Game ${history.length - index}
                    </strong>

                    <button
                        class="delete-btn"
                        onclick="deleteGame(${game.id})">
                        Delete
                    </button>

                </div>

                <small>
                    ${game.date}
                </small>

                <p style="
                    margin-top:10px;
                    margin-bottom:10px;
                    font-weight:bold;
                ">
                    🏆 Winner:
                    ${game.winner}
                    (${game.winningScore} points)
                </p>

                <div>
                    ${playersHTML}
                </div>

                ${roundResultsHTML}
            `;


            container.appendChild(div);
        }
    );
}


// ===============================
// DELETE GAME
// ===============================

function deleteGame(id) {

    if (!confirm(
        "Delete this game from history?"
    )) {
        return;
    }


    let history =
        JSON.parse(
            localStorage.getItem(
                "cardGames"
            )
        ) || [];


    history =
        history.filter(
            game => game.id !== id
        );


    localStorage.setItem(
        "cardGames",
        JSON.stringify(history)
    );


    loadHistory();
}


// ===============================
// HISTORY BUTTON
// ===============================

document
    .getElementById(
        "historyBtn"
    )
    .addEventListener(
        "click",
        showHistory
    );

</script>

</body>
</html>
```
